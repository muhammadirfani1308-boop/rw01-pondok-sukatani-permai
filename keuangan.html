<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transparansi Keuangan RW 01</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    *{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#17324d;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#07366f,#16833b);
  color:white;
  text-align:center;
  padding:30px 15px 35px;
}

header img{
  width:95px;
  height:95px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:7px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

header h1{
  margin:15px 0 6px;
  font-size:30px;
}

header p{
  margin:0;
  opacity:.9;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:-15px auto 0;
  padding:0 15px 30px;
}

/* INTRO */
.intro{
  background:white;
  padding:24px;
  border-radius:18px;
  margin-bottom:20px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  border-left:5px solid #16833b;
}

.intro h2{
  margin-top:0;
  color:#07366f;
}

/* RINGKASAN */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  box-shadow:0 6px 20px rgba(0,0,0,.07);
}

.grid .card{
  border-top:5px solid #07366f;
}

.grid .card:nth-child(2){
  border-top-color:#16833b;
}

.grid .card:nth-child(3){
  border-top-color:#c33d3d;
}

.card small{
  color:#718096;
  font-weight:bold;
}

.card h2{
  color:#07366f;
  margin:8px 0 0;
}

.masuk{
  color:#16833b!important;
}

.keluar{
  color:#c33d3d!important;
}

/* FILTER */
.filter{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0 20px;
}

.filter button{
  padding:9px 15px;
  border:1px solid #dce3eb;
  background:white;
  color:#17324d;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
}

.filter button:hover{
  transform:translateY(-2px);
}

.filter button.active{
  background:#07366f;
  color:white;
  border-color:#07366f;
}

/* TABEL */
.table-wrapper{
  overflow-x:auto;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th,td{
  padding:13px 10px;
  border-bottom:1px solid #edf1f5;
  text-align:left;
  font-size:13px;
}

th{
  background:#f1f5f9;
  color:#07366f;
  font-weight:bold;
}

tbody tr:hover{
  background:#f8fafc;
}

/* PESAN */
.loading{
  text-align:center;
  padding:25px;
  color:#777;
}

.error{
  background:#fdeaea;
  color:#a52e2e;
  padding:15px;
  border-radius:10px;
}

/* FOOTER */
footer{
  background:#07366f;
  color:white;
  text-align:center;
  padding:22px;
  margin-top:10px;
  line-height:1.7;
}

/* HP */
@media(max-width:700px){

  header h1{
    font-size:24px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .card{
    padding:18px;
  }

}
</style>
