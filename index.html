<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Pengurus - RW 01</title><style>:root{--n:#07366f;--g:#16833b;--gold:#f2bd32;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#07366f,#16833b);min-height:100vh;display:grid;place-items:center}.box{background:#fff;width:min(430px,92%);padding:34px;border-radius:22px;box-shadow:0 20px 60px #0004;text-align:center}.logo{width:90px;height:90px;object-fit:contain}.h{color:var(--n);font-size:25px;margin:10px 0 3px}.sub{color:#6b7a8d;margin:0 0 25px}label{text-align:left;display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #d8e1eb;border-radius:10px;font-size:15px}.btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:20px;background:var(--g);color:white;font-weight:700;font-size:15px;cursor:pointer}.demo{margin-top:18px;font-size:12px;color:#718096;background:#f6f8fb;padding:10px;border-radius:10px}.error{color:#c33;font-size:13px;margin-top:10px;display:none}</style></head><body><div class="box"><img class="logo" src="logo-rw01.png"><div class="h">Login Pengurus RW 01</div><p class="sub">Pondok Sukatani Permai</p><form id="f"><label>Email / Username</label><input id="u" required placeholder="Ketua RW / Bendahara RW"><label>Password</label><input id="p" type="password" required placeholder="Masukkan password"><button class="btn">Masuk ke Dashboard</button><div class="error" id="e">Login demo gagal.</div></form><div class="demo">Prototype tahap 3. Login ini masih simulasi dan <b>belum aman untuk data asli</b>. Database & autentikasi akan dibuat pada tahap backend.</div></div><script>f.onsubmit=e=>{e.preventDefault();if((u.value.toLowerCase().includes('ketua')||u.value.toLowerCase().includes('bendahara'))&&p.value){location.href='dashboard.html'}else{document.getElementById('e').style.display='block';e.preventDefault()}}</script><a href="keuangan.html"
