<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RW 01 Pondok Sukatani Permai</title>

<style>
:root{
  --blue:#07366f;
  --green:#16833b;
  --gold:#f2bd32;
  --light:#f4f7fb;
  --text:#26364a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07366f,#16833b);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:min(440px,100%);
  background:white;
  border-radius:24px;
  padding:32px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  margin-bottom:10px;
}

h1{
  margin:5px 0;
  color:var(--blue);
  font-size:25px;
}

.sub{
  margin:0 0 25px;
  color:#718096;
  font-size:14px;
}

label{
  display:block;
  text-align:left;
  margin:14px 0 6px;
  font-size:13px;
  font-weight:bold;
  color:var(--text);
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d9e1eb;
  border-radius:11px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(22,131,59,.12);
}

.btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  margin-top:20px;
  background:var(--green);
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.btn:hover{
  background:#116b30;
}

.transparansi{
  display:block;
  margin-top:15px;
  padding:13px;
  border-radius:11px;
  background:#eef6ff;
  color:var(--blue);
  text-decoration:none;
  font-weight:bold;
  border:1px solid #d8e7f8;
}

.transparansi:hover{
  background:#e3f0ff;
}

.error{
  display:none;
  margin-top:12px;
  color:#c62828;
  font-size:13px;
}

.info{
  margin-top:20px;
  padding:11px;
  border-radius:10px;
  background:#f6f8fb;
  color:#718096;
  font-size:12px;
}

.footer{
  margin-top:18px;
  font-size:11px;
  color:#9aa7b5;
}
</style>
</head>

<body>

<div class="box">

  <img class="logo" src="logo-rw01.png" alt="Logo RW 01">

  <h1>RW 01 Pondok Sukatani Permai</h1>

  <p class="sub">
    Sistem Informasi & Transparansi Keuangan RW
  </p>

  <form id="f">

    <label>Email / Username</label>
    <input
      id="u"
      required
      placeholder="Ketua RW / Bendahara RW"
    >

    <label>Password</label>
    <input
      id="p"
      type="password"
      required
      placeholder="Masukkan password"
    >

    <button class="btn" type="submit">
      🔐 Masuk ke Dashboard
    </button>

    <div class="error" id="e">
      Login gagal. Silakan periksa username dan password.
    </div>

  </form>

  <a class="transparansi" href="keuangan.html">
    💰 Lihat Transparansi Keuangan
  </a>

  <div class="info">
    Portal resmi RW 01 Pondok Sukatani Permai
  </div>

  <div class="footer">
    Kelurahan Sukatani · Kecamatan Rajeg · Kabupaten Tangerang
  </div>

</div>

<script>
document.getElementById("f").onsubmit = function(e){

  e.preventDefault();

  const username =
    document.getElementById("u").value.toLowerCase();

  const password =
    document.getElementById("p").value;

  if(
    (username.includes("ketua") ||
     username.includes("bendahara")) &&
    password
  ){
    location.href = "dashboard.html";
  }else{
    document.getElementById("e").style.display = "block";
  }

};
</script>

</body>
</html>
